<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GO 楽天ROOM候補</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#222;background:#f6f7f9}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}h1{font-size:1.45rem}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0000000b}label{display:block;font-weight:700;margin:10px 0 4px}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #bbb;border-radius:9px}button{background:#bf0000;color:#fff;font-weight:700;border:0;margin-top:14px;cursor:pointer}.muted{color:#666;font-size:.88rem}.error{color:#b00020;white-space:pre-wrap}.score{font-weight:800;color:#bf0000}.price{font-size:1.2rem;font-weight:800}.copy{background:#f4f4f4;padding:12px;border-radius:8px;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.link{display:inline-block;margin-top:8px;color:#a00000;font-weight:700}.copybtn{background:#555;margin-top:8px}.hide{display:none}@media(max-width:520px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
  <h1>GO 楽天ROOM 投稿候補</h1>
  <p class="muted">楽天市場の商品を検索・採点し、ROOM投稿用の文章を作ります。ROOMへの投稿操作は手動です。</p>
  <section class="panel">
    <label for="appId">Application ID</label><input id="appId" autocomplete="username">
    <label for="accessKey">Access Key</label><input id="accessKey" type="password" autocomplete="current-password">
    <p class="muted">どちらも端末やGitHubには保存しません。再読み込み・タブを閉じると入力内容は消えます。</p>
    <div class="row"><div><label for="keyword">検索語</label><input id="keyword" value="電動シェーバー"></div><div><label for="limit">候補数</label><select id="limit"><option>3</option><option selected>5</option><option>10</option></select></div></div>
    <button id="search">候補を作る</button><p id="status" class="muted"></p><p id="error" class="error"></p>
  </section>
  <section id="results"></section>
</main>
<script>
const endpoint='https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701';
const $=id=>document.getElementById(id);
function clean(s){return String(s||'').replace(/[【】★☆◆◇<>＜＞]/g,' ').replace(/\s+/g,' ').trim()}
function score(x){const r=Math.min((+x.reviewCount||0)/250,1)*40;const a=Math.max(0,Math.min(((+x.reviewAverage||0)-3.4)/1.4,1))*35;const p=Math.min(Math.max((+x.pointRate||1)-1,0)/9,1)*15;const s=(+x.postageFlag||0)===0?10:0;return Math.round((r+a+p+s)*10)/10}
function copyText(x){const ship=(+x.postageFlag||0)===0?'送料無料表示':'送料は商品ページで要確認';return `買う前に条件を確認しておきたい注目商品。\n現在の表示は${Number(x.itemPrice||0).toLocaleString()}円、評価${Number(x.reviewAverage||0).toFixed(2)}（${Number(x.reviewCount||0).toLocaleString()}件）。${ship}です。価格・ポイント・在庫は投稿時に再確認してください。\n#楽天ROOM #楽天市場 #買う前にチェック`}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
$('search').onclick=async()=>{const app=$('appId').value.trim(),key=$('accessKey').value.trim(),kw=$('keyword').value.trim();$('error').textContent='';$('results').innerHTML='';if(!app||!key||kw.length<2){$('error').textContent='Application ID、Access Key、2文字以上の検索語を入力してください。';return}$('status').textContent='楽天市場から取得中…';const q=new URLSearchParams({applicationId:app,keyword:kw,hits:'30',format:'json',formatVersion:'2',imageFlag:'1',availability:'1',sort:'-reviewCount'});try{const res=await fetch(`${endpoint}?${q}`,{headers:{accessKey:key}});const data=await res.json();if(!res.ok)throw new Error(`${res.status}: ${data.error_description||data.error||'APIエラー'}`);const n=+$('limit').value;const items=(data.Items||[]).map(x=>({...x,_score:score(x)})).sort((a,b)=>b._score-a._score).slice(0,n);if(!items.length)throw new Error('商品が見つかりませんでした。');items.forEach((x,i)=>{const text=copyText(x);const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="score">候補${i+1}　${x._score}点</div><h2>${esc(clean(x.itemName).slice(0,90))}</h2><div class="price">${Number(x.itemPrice||0).toLocaleString()}円</div><p>評価 ${Number(x.reviewAverage||0).toFixed(2)}（${Number(x.reviewCount||0).toLocaleString()}件）・ポイント${x.pointRate||1}倍</p><div class="copy">${esc(text)}</div><button class="copybtn">投稿文をコピー</button><br><a class="link" href="${esc(x.itemUrl||'')}" target="_blank" rel="noopener">楽天の商品ページを開く</a>`;el.querySelector('button').onclick=async e=>{await navigator.clipboard.writeText(text);e.target.textContent='コピーしました'};$('results').appendChild(el)});$('status').textContent=`${items.length}件の候補を作成しました。`;}catch(e){$('error').textContent=`取得できませんでした。${e.message}\n登録した許可サイトが hanpen13.github.io か確認してください。`;$('status').textContent=''} };
</script></body></html>
