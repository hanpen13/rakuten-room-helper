<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GO 楽天ROOM候補</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#222;background:#f6f7f9}body{margin:0}.wrap{max-width:760px;margin:auto;padding:18px}h1{font-size:1.45rem}.panel,.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0000000b}label{display:block;font-weight:700;margin:10px 0 4px}input,select,button{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #bbb;border-radius:9px}button{background:#bf0000;color:#fff;font-weight:700;border:0;margin-top:14px;cursor:pointer}.muted{color:#666;font-size:.88rem}.error{color:#b00020;white-space:pre-wrap}.score{font-weight:800;color:#bf0000}.price{font-size:1.2rem;font-weight:800}.product-img{display:block;max-width:220px;max-height:220px;margin:10px auto;border-radius:10px}.copy{background:#f4f4f4;padding:12px;border-radius:8px;white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.link{display:inline-block;margin-top:8px;color:#a00000;font-weight:700}.copybtn{background:#555;margin-top:8px}.hide{display:none}@media(max-width:520px){.row{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
  <h1>GO 楽天ROOM 投稿候補</h1>
  <p class="muted">楽天市場の商品を検索・採点し、ROOM投稿用の文章を作ります。ROOMへの投稿操作は手動です。</p>
  <form id="searchForm" class="panel">
    <label for="appId">Application ID</label><input id="appId" autocomplete="username">
    <label for="accessKey">Access Key</label><input id="accessKey" type="password" autocomplete="current-password">
    <p class="muted">どちらも端末やGitHubには保存しません。再読み込み・タブを閉じると入力内容は消えます。</p>
    <div class="row"><div><label for="keyword">今日の商品テーマ</label><input id="keyword"><p id="themeInfo" class="muted"></p></div><div><label for="limit">候補数</label><select id="limit"><option>3</option><option selected>5</option><option>10</option></select></div></div>
    <button id="search" type="submit">候補を作る</button><p id="status" class="muted"></p><p id="error" class="error"></p>
  </form>
  <section id="results"></section>
</main>
<script>
const endpoint='https://openapi.rakuten.co.jp/ichibams/api/IchibaItem/Search/20260701';
const $=id=>document.getElementById(id);
const ownedProducts=[
  {keyword:'パナソニック ER-GK81-S',model:'ER-GK81',label:'パナソニック ボディトリマー ER-GK81-S',owned:'2021年4月から約5年使用中',facts:'VIO対応・お風呂剃り対応の充電式モデルです。'},
  {keyword:'ブラウン オーラルB PRO2 D5055133XWT',model:'D5055133XWT',label:'ブラウン オーラルB PRO2',owned:'2022年6月から約4年使用中',facts:'3モード搭載の電動歯ブラシです。'},
  {keyword:'東芝 GR-A550FH EC',model:'GR-A550FH',label:'東芝 VEGETA GR-A550FH（EC）',owned:'2026年7月に購入して使用中',facts:'購入時は10年保証を付けました。'},
  {keyword:'Fire TV Stick HD 2024',model:'Fire TV Stick HD',label:'Amazon Fire TV Stick HD（2024年モデル）',owned:'2025年8月から使用中',facts:'フルHD対応モデルです。'},
  {keyword:'Mibro Lite 3 Pro',model:'Mibro Lite 3 Pro',label:'Mibro Lite 3 Pro',owned:'2026年9月から使用中',facts:'スマートウォッチとして実際に検証中です。'}
];
function japanDayNumber(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return Math.floor(Date.UTC(+p.year,+p.month-1,+p.day)/86400000)}
const todayOwned=ownedProducts[japanDayNumber()%ownedProducts.length];
$('keyword').value=todayOwned.keyword;
$('themeInfo').textContent=`GO AIの所有品から自動選定：${todayOwned.label}`;
function clean(s){return String(s||'').replace(/[【】★☆◆◇<>＜＞]/g,' ').replace(/\s+/g,' ').trim()}
function score(x){const r=Math.min((+x.reviewCount||0)/250,1)*40;const a=Math.max(0,Math.min(((+x.reviewAverage||0)-3.4)/1.4,1))*35;const p=Math.min(Math.max((+x.pointRate||1)-1,0)/9,1)*15;const s=(+x.postageFlag||0)===0?10:0;return Math.round((r+a+p+s)*10)/10}
function isAccessory(x,kw){const t=String(x.itemName||'');const words=['替刃','替え刃','交換用','洗浄液','洗浄剤','専用ケース','収納ケース','充電器','ACアダプター','ホルダー','キャップ'];return words.some(w=>t.includes(w)&&!kw.includes(w))}
function copyText(x,kw){const ship=(+x.postageFlag||0)===0?'送料無料表示':'送料は商品ページで要確認';const tag=kw.replace(/\s+/g,'').replace(/[^\p{L}\p{N}_ー-]/gu,'');const owned=ownedProducts.find(p=>p.keyword===kw);if(owned)return `${owned.label}を${owned.owned.replace('使用中','使っています')}。${owned.facts}\n長く使っている実用品として紹介します。現在の表示は${Number(x.itemPrice||0).toLocaleString()}円、評価${Number(x.reviewAverage||0).toFixed(2)}（${Number(x.reviewCount||0).toLocaleString()}件）。${ship}。型番・付属品・在庫は商品ページで確認してください。\n#楽天ROOM #愛用品 #${tag} #買って後悔研究所`;return `レビュー数が多く、買う前にチェックしておきたい商品です。\n現在の表示は${Number(x.itemPrice||0).toLocaleString()}円、評価${Number(x.reviewAverage||0).toFixed(2)}（${Number(x.reviewCount||0).toLocaleString()}件）。${ship}。価格・ポイント・在庫は変わるため、商品ページで最新情報を確認してください。\n#楽天ROOM #楽天市場 #${tag} #買う前にチェック`}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
$('searchForm').onsubmit=async event=>{event.preventDefault();const app=$('appId').value.trim(),key=$('accessKey').value.trim(),kw=$('keyword').value.trim();$('error').textContent='';$('results').innerHTML='';if(!app||!key||kw.length<2){$('error').textContent='Application ID、Access Key、2文字以上の検索語を入力してください。';return}$('status').textContent='楽天市場から取得中…';const q=new URLSearchParams({applicationId:app,keyword:kw,hits:'30',format:'json',formatVersion:'2',imageFlag:'1',availability:'1',sort:'-reviewCount'});try{const res=await fetch(`${endpoint}?${q}`,{headers:{accessKey:key}});const data=await res.json();if(!res.ok)throw new Error(`${res.status}: ${data.error_description||data.error||'APIエラー'}`);const n=+$('limit').value;const items=(data.Items||[]).filter(x=>!isAccessory(x,kw)).map(x=>({...x,_score:score(x)})).sort((a,b)=>b._score-a._score).slice(0,n);if(!items.length)throw new Error('本体商品が見つかりませんでした。検索語を変えてください。');items.forEach((x,i)=>{const text=copyText(x,kw);const image=(x.mediumImageUrls&&x.mediumImageUrls[0]&&x.mediumImageUrls[0].imageUrl)||'';const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="score">候補${i+1}　${x._score}点</div>${image?`<img class="product-img" src="${esc(image)}" alt="">`:''}<h2>${esc(clean(x.itemName).slice(0,90))}</h2><div class="price">${Number(x.itemPrice||0).toLocaleString()}円</div><p>評価 ${Number(x.reviewAverage||0).toFixed(2)}（${Number(x.reviewCount||0).toLocaleString()}件）・ポイント${x.pointRate||1}倍</p><div class="copy">${esc(text)}</div><button class="copybtn" type="button">投稿文をコピー</button><br><a class="link" href="${esc(x.itemUrl||'')}" target="_blank" rel="noopener">楽天の商品ページを開く</a>`;el.querySelector('button').onclick=async e=>{await navigator.clipboard.writeText(text);e.target.textContent='コピーしました'};$('results').appendChild(el)});$('status').textContent=`${items.length}件の本体候補を作成しました。`;}catch(e){$('error').textContent=`取得できませんでした。${e.message}\n登録した許可サイトが hanpen13.github.io か確認してください。`;$('status').textContent=''} };
</script></body></html>
